name: build-openwrt-apk

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      upload_release:
        description: Upload APK to GitHub Release
        required: true
        default: "true"
      release_tag:
        description: GitHub Release tag
        required: true
        default: v1.0.0

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    env:
      SDK_URL: https://downloads.openwrt.org/releases/25.12.4/targets/armsr/armv8/openwrt-sdk-25.12.4-armsr-armv8_gcc-14.3.0_musl.Linux-x86_64.tar.zst

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate source
        run: |
          chmod +x tests/run.sh
          tests/run.sh

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib gettext \
            git libncurses-dev libssl-dev python3 rsync unzip zlib1g-dev \
            file wget xz-utils zstd

      - name: Download and verify OpenWrt SDK
        run: |
          set -eu
          mkdir -p /tmp/openwrt-sdk
          cd /tmp/openwrt-sdk
          sdk_name="$(basename "$SDK_URL")"
          sdk_dir_url="${SDK_URL%/*}"
          wget -O "$sdk_name" "$SDK_URL"
          wget -O sha256sums "$sdk_dir_url/sha256sums"
          awk -v name="$sdk_name" '
            $2 == name || $2 == "*" name { print $1 "  " name; found = 1 }
            END { if (!found) exit 1 }
          ' sha256sums > sdk.sha256
          sha256sum -c sdk.sha256
          tar --use-compress-program=unzstd -xf "$sdk_name"
          echo "SDK_DIR=$(find "$PWD" -maxdepth 1 -type d -name 'openwrt-sdk-*' | head -n 1)" >> "$GITHUB_ENV"

      - name: Prepare feeds
        run: |
          cd "$SDK_DIR"
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Copy package into SDK
        run: |
          mkdir -p "$SDK_DIR/package/luci-app-cloudflareapi"
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.release' \
            "$GITHUB_WORKSPACE/" "$SDK_DIR/package/luci-app-cloudflareapi/"

      - name: Build package
        run: |
          cd "$SDK_DIR"
          make defconfig
          make package/luci-app-cloudflareapi/compile V=s

      - name: Collect APK
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist"
          find "$SDK_DIR/bin/packages" -name 'luci-app-cloudflareapi-*.apk' -print -exec cp {} "$GITHUB_WORKSPACE/dist/" \;
          test -n "$(find "$GITHUB_WORKSPACE/dist" -name 'luci-app-cloudflareapi-*.apk' -print -quit)"
          ls -l "$GITHUB_WORKSPACE/dist"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: luci-app-cloudflareapi-apk
          path: dist/*.apk

      - name: Upload release asset
        if: ${{ inputs.upload_release == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ inputs.release_tag }}" dist/*.apk --clobber
